name: Keep server warm

# Free hosting tiers (e.g. Render's free plan) put the backend to sleep after
# ~15 minutes of inactivity, causing a 30-50s cold start on the next request.
# Pinging the health endpoint regularly keeps it always warm, so the app is
# instantly ready whenever the 7am workout notification fires — independent
# of whether the phone itself is online or the app is running.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          if [ -z "${{ vars.SERVER_URL }}" ]; then
            echo "SERVER_URL repository variable is not set yet — skipping ping."
            echo "Set it in GitHub: Settings > Secrets and variables > Actions > Variables."
            exit 0
          fi
          curl -fsS --max-time 60 "${{ vars.SERVER_URL }}/api/health"
